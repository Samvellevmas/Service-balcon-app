<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Балкон">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111827'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='58' fill='white' font-family='system-ui' font-weight='bold'%3EБ%3C/text%3E%3C/svg%3E">
<link id="manifest-link" rel="manifest">
<title>БалконФинанс</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827;-webkit-tap-highlight-color:transparent}
header{background:#111827;color:white;padding:14px 60px 12px 16px;position:sticky;top:0;z-index:5}
h1{font-size:19px;margin:0 0 3px}
.sub{font-size:12px;color:#cbd5e1}
#syncIco{position:absolute;right:14px;top:14px;font-size:20px;cursor:pointer;padding:6px}
main{max-width:760px;margin:auto;padding:12px 12px 96px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:white;border-radius:14px;padding:13px;box-shadow:0 1px 3px #00000010}
.label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.03em}
.num{font-size:19px;font-weight:750;margin-top:3px}
.profit{color:#15803d}.danger{color:#b91c1c}.blue{color:#1e40af}
.muted{font-size:12px;color:#6b7280}
.section{margin-top:16px}
.section h2{font-size:15px;margin:0 0 8px;color:#374151}
.obj{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.obj strong{font-size:14px}
.badge{font-size:11px;padding:3px 7px;border-radius:7px;background:#f3f4f6;font-weight:600;white-space:nowrap}
.positive{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.negative{background:#fee2e2;color:#991b1b}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{border:0;border-radius:11px;padding:12px 8px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.primary{background:#111827;color:white}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1e40af}.gray{background:#f3f4f6;color:#374151}.ghost{background:transparent;color:#374151;border:1px solid #e5e7eb}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;padding:6px;z-index:10;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.bottom>div{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.bottom button{background:transparent;color:#6b7280;padding:8px 2px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom button.active{color:#111827}
.bottom .ic{font-size:18px;line-height:1}
.empty{padding:22px;text-align:center;color:#6b7280;background:white;border-radius:14px;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:12px;align-items:flex-end}
.modal.show{display:flex}
.sheet{background:white;border-radius:18px 18px 0 0;width:100%;max-width:760px;margin:auto;padding:16px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:17px}
label{display:block;font-size:11px;color:#6b7280;margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;background:white;font-family:inherit;color:#111827}
input.cb{width:auto;padding:0}
.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:9px 14px;border-radius:9px;display:none;z-index:30;font-size:13px;white-space:nowrap;max-width:90vw}
.op-row{background:white;border-radius:12px;padding:11px 13px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.op-row:active{background:#f9fafb}
.op-amount{font-weight:750;font-size:14px;white-space:nowrap}
.op-meta{font-size:11px;color:#6b7280;margin-top:2px}
.chip{display:inline-block;font-size:10px;padding:2px 6px;background:#f3f4f6;border-radius:5px;color:#4b5563;font-weight:600;margin-right:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.tabs button{padding:7px 12px;border-radius:9px;background:white;color:#4b5563;font-size:12px;white-space:nowrap;font-weight:600}
.tabs button.active{background:#111827;color:white}
.big{font-size:22px;font-weight:800}
.hero{background:linear-gradient(135deg,#111827,#374151);color:white;border-radius:16px;padding:16px;margin-bottom:12px}
.hero .label{color:#cbd5e1}.hero .sub2{font-size:12px;color:#cbd5e1;margin-top:3px}
.hint{font-size:12px;color:#6b7280;line-height:1.5;margin:6px 0}
.hint code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:11px}
details{background:white;border-radius:12px;padding:12px;margin-bottom:8px}
details summary{cursor:pointer;font-weight:700;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>БалконФинанс</h1>
  <div class="sub" id="subLine">Контроль объектов и денег</div>
  <div id="syncIco" onclick="go('more')">⚪</div>
</header>
<main id="app"></main>
<nav class="bottom"><div>
  <button data-tab="home" onclick="go('home')"><span class="ic">🏠</span>Главная</button>
  <button data-tab="objects" onclick="go('objects')"><span class="ic">🏗</span>Объекты</button>
  <button data-tab="ops" onclick="go('ops')"><span class="ic">📋</span>Операции</button>
  <button data-tab="more" onclick="go('more')"><span class="ic">⚙️</span>Ещё</button>
</div></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ========== UTILS ========== */
const fmt = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n||0))+' ₽';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return `${dd}.${m}.${y.slice(2)}`; };
const fmtDateTime = ts => { if(!ts) return '—'; const d=new Date(ts); return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); };

/* ========== PWA MANIFEST ========== */
(function(){
  try{
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#111827"/><text x="256" y="345" text-anchor="middle" font-size="280" font-family="system-ui,sans-serif" font-weight="bold" fill="white">Б</text></svg>`;
    const iconUrl = 'data:image/svg+xml,'+encodeURIComponent(svg);
    const manifest = {
      name:'БалконФинанс', short_name:'Балкон', description:'Контроль объектов и денег',
      start_url:'.', scope:'.', display:'standalone',
      background_color:'#111827', theme_color:'#111827',
      icons:[{src:iconUrl,sizes:'192x192',type:'image/svg+xml',purpose:'any'},
             {src:iconUrl,sizes:'512x512',type:'image/svg+xml',purpose:'maskable'}]
    };
    const blob = new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    document.getElementById('manifest-link').href = URL.createObjectURL(blob);
  }catch(e){}
})();

/* ========== DATA ========== */
const KEY='balcony_finance_v2';
const DEFAULT={partners:['Партнёр 1','Партнёр 2'],
  categories:['Материалы','Доставка','Подъём','Вывоз мусора','АЗС','Ремонт авто','Инструмент','Расходники','Питание','Прочее'],
  objects:[],ops:[],transfers:[]};

let data = (()=>{
  try{const raw=localStorage.getItem(KEY); if(raw) return JSON.parse(raw);}catch(e){}
  try{
    const v1=localStorage.getItem('balcony_finance_demo_v1');
    if(v1){
      const old=JSON.parse(v1); const d=JSON.parse(JSON.stringify(DEFAULT));
      d.objects=(old.objects||[]).map(o=>({id:String(o.id),name:o.name,client:o.client||'',phone:o.phone||'',address:o.address||'',contract:Number(o.contract)||0,createdAt:Date.now()}));
      d.ops=(old.ops||[]).map(o=>({id:String(o.id),type:o.type,obj:String(o.obj),amount:Number(o.amount)||0,date:o.date,note:o.note||'',cat:o.cat||'',extra:false,partner:''}));
      d.transfers=(old.transfers||[]).map(t=>({id:String(t.id),from:String(t.from),to:String(t.to),amount:Number(t.amount)||0,date:t.date||today(),note:t.note||'',partner:''}));
      return d;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
})();

/* ========== SYNC ========== */
const SYNC_KEY='balcony_sync_v1';
let syncCfg = JSON.parse(localStorage.getItem(SYNC_KEY)||'{}');
// {owner, repo, token, path:'data.json', auto:true, lastSync, lastError}
let syncState = 'idle'; // idle | syncing | ok | error | off
let syncTimer = null;

function saveSyncCfg(){localStorage.setItem(SYNC_KEY,JSON.stringify(syncCfg));updateSyncIco();}

function updateSyncIco(){
  const ico=document.getElementById('syncIco');
  if(!syncCfg.token||!syncCfg.owner||!syncCfg.repo){syncState='off';ico.textContent='⚪';ico.title='Синхронизация не настроена';return;}
  ico.textContent = syncState==='syncing'?'⏳':syncState==='error'?'⚠️':syncState==='ok'?'☁️':'☁️';
  ico.title = syncCfg.lastSync?('Синхронизировано '+fmtDateTime(syncCfg.lastSync)):'Готово к синхронизации';
}

function b64encode(str){return btoa(unescape(encodeURIComponent(str)))}
function b64decode(str){return decodeURIComponent(escape(atob(str.replace(/\n/g,''))))}

async function ghGet(){
  const {owner,repo,token,path='data.json'}=syncCfg;
  const url=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const r=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','If-None-Match':'no-cache'}});
  if(r.status===404) return {content:null,sha:null};
  if(r.status===401) throw new Error('Неверный токен (401)');
  if(r.status===403) throw new Error('Нет доступа к репо (403)');
  if(!r.ok) throw new Error('Ошибка GitHub '+r.status);
  const j=await r.json();
  return {content:JSON.parse(b64decode(j.content)),sha:j.sha};
}

async function ghPut(payload,sha){
  const {owner,repo,token,path='data.json'}=syncCfg;
  const url=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const body={message:'sync '+new Date().toISOString().slice(0,16),content:b64encode(JSON.stringify(payload,null,2))};
  if(sha) body.sha=sha;
  const r=await fetch(url,{method:'PUT',
    headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(r.status===409) throw new Error('CONFLICT');
  if(r.status===401) throw new Error('Неверный токен');
  if(r.status===404) throw new Error('Репозиторий не найден');
  if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' '+t.slice(0,80))}
  const j=await r.json();
  return j.content.sha;
}

function mergeData(a,b){
  const mergeArr=(x,y)=>{const m=new Map();[...x,...y].forEach(v=>m.set(v.id,v));return [...m.values()]};
  return {
    partners:[...new Set([...(a.partners||[]),...(b.partners||[])])],
    categories:[...new Set([...(a.categories||[]),...(b.categories||[])])],
    objects:mergeArr(a.objects||[],b.objects||[]),
    ops:mergeArr(a.ops||[],b.ops||[]),
    transfers:mergeArr(a.transfers||[],b.transfers||[])
  };
}

async function syncNow(silent=false){
  if(!syncCfg.token||!syncCfg.owner||!syncCfg.repo){if(!silent)toast('Синхронизация не настроена');return;}
  if(!navigator.onLine){if(!silent)toast('Нет интернета');return;}
  syncState='syncing';updateSyncIco();
  try{
    const remote=await ghGet();
    let sha=remote.sha;
    if(remote.content){
      // merge: local + remote, приоритет — fresh по updatedAt
      data=mergeData(data,remote.content);
    }
    sha=await ghPut(data,sha);
    syncCfg.sha=sha;
    syncCfg.lastSync=Date.now();
    syncCfg.lastError='';
    saveSyncCfg();
    persist(false); // без повторного триггера sync
    syncState='ok';
    if(!silent){toast('Синхронизировано');render();}
  }catch(e){
    syncState='error';
    syncCfg.lastError=e.message;
    saveSyncCfg();
    if(!silent)toast('Ошибка синхронизации: '+e.message);
    console.error(e);
  }
  updateSyncIco();
  if(view.name==='more') render();
}

function scheduleSync(){
  if(!syncCfg.auto||!syncCfg.token) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{syncNow(true).catch(()=>{})},1200);
}

/* ========== PERSIST ========== */
function persist(triggerSync=true){
  localStorage.setItem(KEY,JSON.stringify(data));
  if(triggerSync) scheduleSync();
}

/* ========== HELPERS ========== */
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2000)}
const objName=id=>(data.objects.find(o=>o.id===id)||{}).name||'—';

function objStats(o){
  const ops=data.ops;
  const inc=ops.filter(x=>x.type==='income'&&x.obj===o.id&&!x.extra).reduce((s,x)=>s+x.amount,0);
  const extra=ops.filter(x=>x.type==='income'&&x.obj===o.id&&x.extra).reduce((s,x)=>s+x.amount,0);
  const exp=ops.filter(x=>x.type==='expense'&&x.obj===o.id).reduce((s,x)=>s+x.amount,0);
  const tOut=data.transfers.filter(t=>t.from===o.id).reduce((s,t)=>s+t.amount,0);
  const tIn=data.transfers.filter(t=>t.to===o.id).reduce((s,t)=>s+t.amount,0);
  const revenue=(Number(o.contract)||0)+extra;
  return {inc,extra,exp,tOut,tIn,revenue,
    contractLeft:Math.max(0,(Number(o.contract)||0)-inc),
    profit:revenue-exp,
    balance:inc+extra-exp-tOut+tIn,
    pct:o.contract?Math.min(100,Math.round(inc/o.contract*100)):0};
}
function totalCash(){return data.ops.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0)-data.ops.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);}
function totalStats(){return data.objects.reduce((a,o)=>{const s=objStats(o);a.revenue+=s.revenue;a.exp+=s.exp;a.profit+=s.profit;a.received+=s.inc+s.extra;a.contractLeft+=s.contractLeft;return a},{revenue:0,exp:0,profit:0,received:0,contractLeft:0});}
function allOpsSorted(){
  const ops=data.ops.map(x=>({...x,kind:'op'}));
  const tr=data.transfers.map(x=>({...x,kind:'transfer'}));
  return [...ops,...tr].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}

/* ========== ROUTER ========== */
let view={name:'home',objId:null,filterObj:null,filterType:null};
function go(name,objId){
  view.name=name;
  if(objId!==undefined) view.objId=objId;
  window.scrollTo({top:0,behavior:'instant'});
  render();
}

/* ========== RENDER ========== */
function render(){
  document.querySelectorAll('.bottom button').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===view.name||(view.name==='object'&&b.dataset.tab==='objects'));
  });
  const app=document.getElementById('app');
  if(view.name==='objects') app.innerHTML=viewObjects();
  else if(view.name==='object') app.innerHTML=viewObject(view.objId);
  else if(view.name==='ops') app.innerHTML=viewOps();
  else if(view.name==='more') app.innerHTML=viewMore();
  else app.innerHTML=viewHome();

  // субтитул в шапке
  const sub=document.getElementById('subLine');
  if(syncCfg.lastSync){sub.textContent='Синхр: '+fmtDateTime(syncCfg.lastSync);}
  else sub.textContent='Контроль объектов и денег';
}

/* -------- HOME -------- */
function viewHome(){
  const cash=totalCash(); const t=totalStats(); const recent=allOpsSorted().slice(0,8);
  return `
  <div class="hero">
    <div class="label">Наличные (общий котёл)</div>
    <div class="big">${fmt(cash)}</div>
    <div class="sub2">Получено ${fmt(t.received)} · Потрачено ${fmt(t.exp)}</div>
  </div>
  <div class="cards">
    <div class="card"><div class="label">Общая прибыль</div><div class="num profit">${fmt(t.profit)}</div><div class="muted" style="margin-top:3px">по договорам</div></div>
    <div class="card"><div class="label">Осталось получить</div><div class="num">${fmt(t.contractLeft)}</div><div class="muted" style="margin-top:3px">от клиентов</div></div>
  </div>
  <div class="section">
    <h2>Быстрые действия</h2>
    <div class="row3">
      <button class="green" onclick="openOp('income')">＋ Приход</button>
      <button class="red" onclick="openOp('expense')">− Расход</button>
      <button class="blue" onclick="openOp('transfer')">↔ Передача</button>
    </div>
  </div>
  <div class="section">
    <h2>Последние операции</h2>
    <div>${recent.length?recent.map(opHTML).join(''):'<div class="empty">Операций пока нет</div>'}</div>
  </div>`;
}

/* -------- OBJECTS -------- */
function viewObjects(){
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h2 style="font-size:15px;margin:0;color:#374151">Объекты (${data.objects.length})</h2>
    <button class="primary" onclick="openObjectForm()">＋ Новый</button>
  </div>
  ${data.objects.length?data.objects.map(objCardHTML).join(''):'<div class="empty">Пока нет объектов.<br>Нажмите «Новый»</div>'}`;
}
function objCardHTML(o){
  const s=objStats(o);
  const balCls=s.balance<0?'danger':s.balance>0?'profit':'';
  const profCls=s.profit>=0?'profit':'danger';
  return `
  <div class="card" style="margin-bottom:9px" onclick="go('object','${o.id}')">
    <div class="obj">
      <div>
        <strong>${esc(o.name)}</strong>
        <div class="muted">${esc(o.client||'—')}${o.phone?' · '+esc(o.phone):''}</div>
        <div class="muted">${esc(o.address||'')}</div>
      </div>
      <span class="badge ${s.pct>=100?'positive':s.pct>=50?'warn':''}">${s.pct}%</span>
    </div>
    <div class="row2" style="margin-top:10px">
      <div><div class="label">Договор</div><b>${fmt(o.contract)}</b></div>
      <div><div class="label">Прибыль</div><b class="${profCls}">${fmt(s.profit)}</b></div>
      <div><div class="label">Расходы</div><b class="danger">${fmt(s.exp)}</b></div>
      <div><div class="label">В конверте</div><b class="${balCls}">${fmt(s.balance)}</b></div>
    </div>
  </div>`;
}

/* -------- OBJECT DETAIL -------- */
function viewObject(id){
  const o=data.objects.find(x=>x.id===id);
  if(!o) return '<div class="empty">Объект не найден</div>';
  const s=objStats(o);
  const ops=allOpsSorted().filter(x=>x.kind==='op'?x.obj===id:(x.from===id||x.to===id));
  const profCls=s.profit>=0?'profit':'danger';
  const balCls=s.balance<0?'danger':'profit';
  return `
  <button class="ghost" onclick="go('objects')" style="margin-bottom:10px">← К объектам</button>
  <div class="hero">
    <div class="label">Баланс объекта (в конверте)</div>
    <div class="big">${fmt(s.balance)}</div>
    <div class="sub2">Договор ${fmt(o.contract)} · Получено ${fmt(s.inc+s.extra)} · Расходы ${fmt(s.exp)}</div>
  </div>
  <div class="cards">
    <div class="card"><div class="label">Прибыль</div><div class="num ${profCls}">${fmt(s.profit)}</div></div>
    <div class="card"><div class="label">Осталось получить</div><div class="num">${fmt(s.contractLeft)}</div></div>
  </div>
  <div class="section">
    <div class="row3">
      <button class="green" onclick="openOp('income','${id}')">＋ Приход</button>
      <button class="red" onclick="openOp('expense','${id}')">− Расход</button>
      <button class="blue" onclick="openOp('transfer','${id}')">↔ Передать</button>
    </div>
    <div class="row2" style="margin-top:6px">
      <button class="gray" onclick="openObjectForm('${id}')">✎ Изменить</button>
      <button class="gray" onclick="deleteObject('${id}')">🗑 Удалить</button>
    </div>
  </div>
  <div class="section">
    <h2>Контакты</h2>
    <div class="card">
      <div><b>${esc(o.client||'—')}</b></div>
      <div class="muted" style="margin-top:3px">${esc(o.address||'')}</div>

function viewOps(){
  let list=allOpsSorted();
  if(view.filterObj) list=list.filter(x=>x.kind==='op'?x.obj===view.filterObj:(x.from===view.filterObj||x.to===view.filterObj));
  if(view.filterType) list=list.filter(x=>x.kind==='transfer'?view.filterType==='transfer':x.type===view.filterType);
  list=list.slice(0,200);
  const objChips=data.objects.map(o=>`<button class="${view.filterObj===o.id?'active':''}" onclick="setFilter('obj','${o.id}')">${esc(o.name)}</button>`).join('');
  return `
  <div class="tabs">
    <button class="${!view.filterType?'active':''}" onclick="setFilter('type',null)">Все</button>
    <button class="${view.filterType==='income'?'active':''}" onclick="setFilter('type','income')">Приходы</button>
    <button class="${view.filterType==='expense'?'active':''}" onclick="setFilter('type','expense')">Расходы</button>
    <button class="${view.filterType==='transfer'?'active':''}" onclick="setFilter('type','transfer')">Передачи</button>
  </div>
  <div class="tabs">
    <button class="${!view.filterObj?'active':''}" onclick="setFilter('obj',null)">Все объекты</button>
    ${objChips}
  </div>
  ${list.length?list.map(opHTML).join(''):'<div class="empty">Ничего не найдено</div>'}`;
}
function setFilter(k,v){if(k==='obj')view.filterObj=v;if(k==='type')view.filterType=v;render();}

function opHTML(x){
  if(x.kind==='transfer'){
    return `<div class="op-row" onclick="openOp('transfer',null,'${x.id}')">
      <div>
        <b>↔ Передача</b>
        <div class="op-meta">${esc(objName(x.from))} → ${esc(objName(x.to))} · ${fmtDate(x.date)}${x.partner?' · '+esc(x.partner):''}</div>
        ${x.note?`<div class="op-meta">${esc(x.note)}</div>`:''}
      </div>
      <div class="op-amount blue">${fmt(x.amount)}</div>
    </div>`;
  }
  const isInc=x.type==='income';
  const sign=isInc?'+':'−'; const cls=isInc?'profit':'danger';
  const tags=[];
  if(x.cat) tags.push(x.cat);
  if(x.partner) tags.push(x.partner);
  if(x.extra) tags.push('доп');
  return `<div class="op-row" onclick="openOp('${x.type}',null,'${x.id}')">
    <div>
      <b>${sign} ${isInc?'Приход':'Расход'}</b>
      <div class="op-meta">${esc(objName(x.obj))} · ${fmtDate(x.date)}</div>
      ${x.note?`<div class="op-meta">${esc(x.note)}</div>`:''}
      ${tags.length?`<div style="margin-top:3px">${tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}
    </div>
    <div class="op-amount ${cls}">${sign}${fmt(x.amount)}</div>
  </div>`;
}

function openOp(kind,objId,editId){
  if(!data.objects.length){toast('Сначала создайте объект');openObjectForm();return;}
  const editing=!!editId;
  let op=null;
  if(editing){op=kind==='transfer'?data.transfers.find(t=>t.id===editId):data.ops.find(x=>x.id===editId);}
  const objOpts=sel=>data.objects.map(o=>`<option value="${o.id}" ${sel===o.id?'selected':''}>${esc(o.name)}</option>`).join('');
  const partnerOpts=sel=>['<option value="">—</option>',...data.partners.map(p=>`<option ${sel===p?'selected':''}>${esc(p)}</option>`)].join('');
  const catOpts=sel=>data.categories.map(c=>`<option ${sel===c?'selected':''}>${esc(c)}</option>`).join('');

  if(kind==='transfer'){
    const from=op?op.from:(objId||data.objects[0].id);
    const to=op?op.to:(data.objects.find(o=>o.id!==from)?.id||from);

      <h2>${editing?'Изменить передачу':'Передача между объектами'}</h2>
      <label>Откуда</label><select id="f_from">${objOpts(from)}</select>
      <label>Куда</label><select id="f_to">${objOpts(to)}</select>

      <label>Дата</label><input id="f_date" type="date" value="${op?op.date:today()}">
      <label>Кто передал</label><select id="f_partner">${partnerOpts(op?.partner||'')}</select>
      <label>Причина</label><input id="f_note" placeholder="Например, материалы для объекта" value="${op?esc(op.note||''):''}">
      <div class="actions">
        ${editing?`<button class="red" onclick="deleteOp('transfer','${editId}')">Удалить</button>`:''}
        <button class="ghost" onclick="closeModal()">Отмена</button>
        <button class="primary" onclick="saveOp('transfer','${editId||''}')">Сохранить</button>
      </div>`);
  } else if(kind==='income'){
    const sel=op?op.obj:(objId||data.objects[0].id);
    openModal(`
      <h2>${editing?'Изменить приход':'Новый приход'}</h2>
      <label>Объект</label><select id="f_obj">${objOpts(sel)}</select>
      <label>Сумма, ₽</label><input id="f_amount" type="number" inputmode="decimal" placeholder="0" value="${op?op.amount:''}">
      <label>Дата</label><input id="f_date" type="date" value="${op?op.date:today()}">
      <label>Кто принял</label><select id="f_partner">${partnerOpts(op?.partner||'')}</select>
      <label>Комментарий</label><input id="f_note" placeholder="1-й взнос, 2-й взнос…" value="${op?esc(op.note||''):''}">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;color:#111827;font-weight:500;font-size:13px;margin-top:12px">
        <input type="checkbox" id="f_extra" class="cb" ${op?.extra?'checked':''}>
        Доп. работа (сверх договора)
      </label>
      <div class="actions">
        ${editing?`<button class="red" onclick="deleteOp('income','${editId}')">Удалить</button>`:''}
        <button class="ghost" onclick="closeModal()">Отмена</button>
        <button class="primary" onclick="saveOp('income','${editId||''}')">Сохранить</button>
      </div>`);
  } else {
    const sel=op?op.obj:(objId||data.objects[0].id);
    openModal(`
      <h2>${editing?'Изменить расход':'Новый расход'}</h2>
      <label>Объект</label><select id="f_obj">${objOpts(sel)}</select>
      <label>Сумма, ₽</label><input id="f_amount" type="number" inputmode="decimal" placeholder="0" value="${op?op.amount:''}">
      <label>Дата</label><input id="f_date" type="date" value="${op?op.date:today()}">
      <label>Категория</label><select id="f_cat">${catOpts(op?.cat||'')}</select>
      <label>Кто оплатил</label><select id="f_partner">${partnerOpts(op?.partner||'')}</select>
      <label>На что потрачено</label><input id="f_note" placeholder="Ламинат 18 м², пена 2 шт…" value="${op?esc(op.note||''):''}">
      <div class="actions">
        ${editing?`<button class="red" onclick="deleteOp('expense','${editId}')">Удалить</button>`:''}

        <button class="primary" onclick="saveOp('expense','${editId||''}')">Сохранить</button>

function saveOp(kind,editId){
  const amount=Number(document.getElementById('f_amount').value);
  if(!amount||amount<=0){toast('Введите сумму');return;}
  const date=document.getElementById('f_date').value||today();
  const partner=document.getElementById('f_partner').value;
  const note=document.getElementById('f_note').value.trim();
  if(kind==='transfer'){
    const from=document.getElementById('f_from').value;
    const to=document.getElementById('f_to').value;
    if(from===to){toast('Выберите разные объекты');return;}
    if(editId) Object.assign(data.transfers.find(x=>x.id===editId),{from,to,amount,date,partner,note});
    else data.transfers.push({id:uid(),from,to,amount,date,partner,note,createdAt:Date.now()});
  } else {
    const obj=document.getElementById('f_obj').value;
    if(!obj){toast('Сначала создайте объект');return;}
    const op={type:kind,obj,amount,date,partner,note};
    if(kind==='expense') op.cat=document.getElementById('f_cat').value;
    else op.extra=document.getElementById('f_extra').checked;
    if(editId) Object.assign(data.ops.find(x=>x.id===editId),op);
    else data.ops.push({id:uid(),...op,createdAt:Date.now()});
  }
  persist();closeModal();render();toast('Сохранено');
}
function deleteOp(kind,id){
  if(!confirm('Удалить операцию?'))return;
  if(kind==='transfer') data.transfers=data.transfers.filter(t=>t.id!==id);
  else data.ops=data.ops.filter(x=>x.id!==id);
  persist();closeModal();render();toast('Удалено');
}

/* -------- EXPORT / IMPORT -------- */
function exportCSV(){
  const rows=[['Дата','Тип','Объект','Категория','Сумма','Партнёр','Комментарий']];
  allOpsSorted().forEach(x=>{
    if(x.kind==='transfer') rows.push([x.date,'Передача',`${objName(x.from)} → ${objName(x.to)}`,'',x.amount,x.partner||'',x.note||'']);
    else rows.push([x.date,x.type==='income'?'Приход':'Расход',objName(x.obj),x.cat||'',x.amount,x.partner||'',x.note||'']);
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`balkon_finance_${today()}.csv`);
}
function exportJSON(){download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`balkon_backup_${today()}.json`);}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d.objects||!d.ops) throw new Error('Неверный формат');
      if(!confirm('Заменить все локальные данные?'))return;
      data=d;data.partners=data.partners||[...DEFAULT.partners];data.categories=data.categories||[...DEFAULT.categories];data.transfers=data.transfers||[];
      persist();render();toast('Восстановлено');}catch(err){toast('Ошибка: '+err.message);}};
    r.readAsText(f);};
  inp.click();
}
function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
function resetAll(){
  if(!confirm('Удалить ВСЕ данные локально?'))return;
  if(!confirm('Точно? Резервную копию вы сделали?'))return;
  data=JSON.parse(JSON.stringify(DEFAULT));persist();go('home');toast('Сброшено');
}
